{% extends "base.html" %}
{% block title %}{{ 'Редагувати' if transaction else 'Нова transaction' }} — Coin Control{% endblock %}
{% block content %}
<a href="{{ url_for('index') }}" class="cc-back"><i class="ti ti-arrow-left"></i> Назад</a>

<div class="cc-card" style="max-width:560px;">
  <div style="font-size:18px;font-weight:600;color:#1a1a2e;margin-bottom:24px;display:flex;align-items:center;gap:10px;">
    <i class="ti ti-{{ 'edit' if transaction else 'plus-circle' }}" style="color:var(--cc-gold);font-size:20px;"></i>
    {{ 'Редагувати transaction' if transaction else 'Нова transaction' }}
  </div>

  <form method="POST">
    <div style="margin-bottom:16px;">
      <label class="cc-form-label">Назва *</label>
      <input type="text" name="title" class="cc-form-input"
             value="{{ transaction.title if transaction else '' }}"
             placeholder="Наприклад: Продукти" required>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">
      <div>
        <label class="cc-form-label">Сума *</label>
        <input type="number" name="amount" class="cc-form-input" step="0.01" min="0.01"
               value="{{ transaction.amount if transaction else '' }}" required>
      </div>
      <div>
        <label class="cc-form-label">Валюта</label>
        <select name="currency" class="cc-form-input">
          <option value="UAH" {{ 'selected' if transaction and transaction.currency == 'UAH' }}>UAH ₴</option>
          <option value="USD" {{ 'selected' if transaction and transaction.currency == 'USD' }}>USD $</option>
          <option value="EUR" {{ 'selected' if transaction and transaction.currency == 'EUR' }}>EUR €</option>
        </select>
      </div>
      <div>
        <label class="cc-form-label">Дата *</label>
        <input type="date" name="date" class="cc-form-input"
               value="{{ transaction.date.strftime('%Y-%m-%d') if transaction else '' }}" required>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">
      <div>
        <label class="cc-form-label">Тип</label>
        <select name="type" class="cc-form-input">
          <option value="expense" {{ 'selected' if transaction and transaction.type == 'expense' }}>Витрата</option>
          <option value="income"  {{ 'selected' if transaction and transaction.type == 'income' }}>Дохід</option>
        </select>
      </div>
      <div>
        <label class="cc-form-label">Категорія</label>
        <select name="category_id" class="cc-form-input">
          <option value="">— без категорії —</option>
          {% for cat in categories %}
            <option value="{{ cat.id }}" {{ 'selected' if transaction and transaction.category_id == cat.id }}>
              {{ cat.icon }} {{ cat.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="cc-form-label">Рахунок</label>
        <select name="account_id" class="cc-form-input">
          <option value="">— без рахунку —</option>
          {% for acc in accounts %}
            <option value="{{ acc.id }}" {{ 'selected' if transaction and transaction.account_id == acc.id }}>
              {{ acc.icon }} {{ acc.name }}
            </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="margin-bottom:24px;">
      <label class="cc-form-label">Нотатка</label>
      <textarea name="note" class="cc-form-input" rows="2"
                placeholder="Необов'язково">{{ transaction.note if transaction else '' }}</textarea>
    </div>

    <div style="display:flex;gap:10px;">
      <button type="submit" class="cc-submit-btn">
        <i class="ti ti-check"></i> {{ 'Зберегти' if transaction else 'Додати' }}
      </button>
      <a href="{{ url_for('index') }}" class="cc-cancel-btn">Скасувати</a>
    </div>
  </form>
</div>
{% endblock %}
